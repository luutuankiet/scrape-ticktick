version: 2
models:
  - name: fact_todos
    meta:
      joins:
        - join: dim_lists
          sql_on: ${fact_todos.list_key} = ${dim_lists.list_key}
        - join: dim_folders
          sql_on: ${fact_todos.folder_key} = ${dim_folders.folder_key}
        - join: dim_statuses
          sql_on: ${fact_todos.status_key} = ${dim_statuses.status_key}
      columns:
        - name: todo_id
          description: ""
          meta:
            dimension:
              type: string
            metrics:
              tasks_count:
                type: count
              overdue_tasks:
                type: count
                description: >
                  - use case : see if there are unattended tasks from the day
                  before and take actions to it. mostly reschedule.

                  - logic : count of task that 
                    - is a task type
                    - is active
                    - belongs to active list
                    - is undone
                    - do not have default due date
                    - due date before today
                  - example usage: "dbt parse && mf query --metrics
                  overdue_tasks --group-by todo_id__is_repeat"
                filters:
                  - is_task: true
                  - is_active: true
                  - dim_lists.is_active: true
                  - dim_statuses.status_name: undone
                  - due_date: "!%1900%"
                  - due_date: < now()
        - name: folder_name
          description: ""
          meta:
            dimension:
              type: string
        - name: list_name
          description: ""
          meta:
            dimension:
              type: string
        - name: status_id
          description: ""
          tests:
            - not_null
          meta:
            dimension:
              type: number
        - name: title
          description: ""
          meta:
            dimension:
              type: string
        - name: timezone
          description: ""
          meta:
            dimension:
