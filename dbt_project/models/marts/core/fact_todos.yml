              type: timestamp
        - name: dim_tag
          description: the tags parsed from tasks.
          type: string
          sql: >-
            TRIM(BOTH ' ' FROM REPLACE(REPLACE(REPLACE(${fact_todos.tags}, '[',
            ''), ']', ''), '''', ''))
        - name: tag_semantic
          type: string
          sql: >
            case when ${fact_todos.tags} like '%clarifyme%' then 'inbox'  when
            ${fact_todos.tags} = 'default' or ${fact_todos.tags} like '%@%' then
            'next action' when ${fact_todos.tags} like '%someday%' then
            'someday' when ${fact_todos.tags} like '%waiting_for%' then 'waiting
            for'  when ${fact_todos.tags} like '%tickler%' then 'tickler'  else
            TRIM(BOTH ' ' FROM REPLACE(REPLACE(REPLACE(${fact_todos.tags}, '[',
            ''), ']', ''), '''', ''))       end
          meta:
            metrics:
              tags_count:
                type: count
        - name: task_title
          type: string
          sql: title
          description: for debugging purpose; drills down to the name of task
        - name: is_repeat
          type: boolean
          sql: >-
            case when ${fact_todos.repeatFlag} <> 'default' then true else false
            end
        - name: is_task
          type: boolean
          sql: >-
            case when NOT (${fact_todos.kind} = 'NOTE' or ${fact_todos.tags}
            like '%tickler%') then true else false end
        - name: is_active
          type: boolean
          description: >
            the item belongs to an active folder - not in ('🚀SOMEDAY
            lists','🛩Horizon of focus','💤on hold lists')
          sql: >
            case when ${fact_todos.folder_name} not in ('🚀SOMEDAY
            lists','🛩Horizon of focus','💤on hold lists') 

            AND

            ${fact_todos.list_name} not in ('🧳SOMEDAY','📍ref - tickler notes
            for the day')


            then true else false end
