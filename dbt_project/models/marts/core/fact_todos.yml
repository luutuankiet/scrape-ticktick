version: 2
models:
  - name: fact_todos
    meta:
      order_fields_by: index
      required_filters:
        - due_date.date_id: inTheNext 4 weeks
        # - todo_id_lookahead: "!null" # todo: watch when LD allows triggers overriding this filter. for now define it @ metric level
      joins:
        - join: dim_lists
          type: inner
          sql_on: ${fact_todos.list_key} = ${dim_lists.list_key}
        - join: dim_folders
          type: inner
          sql_on: ${fact_todos.folder_key} = ${dim_folders.folder_key}
        - join: dim_statuses
          type: inner
          sql_on: ${fact_todos.status_key} = ${dim_statuses.status_key}
        - join: dim_dates
          type: inner
          alias: start_date
          sql_on: ${start_date.date_key} = ${fact_todos.date_start_key}
        - join: dim_dates
          type: inner
          alias: due_date
          sql_on: ${due_date.date_key} = ${fact_todos.date_due_key}
        - join: dim_dates
          type: inner
          alias: completed_date
          sql_on: ${completed_date.date_key} = ${fact_todos.date_completed_key}
        - join: dim_dates
          type: inner
          alias: created_date
          sql_on: ${created_date.date_key} = ${fact_todos.date_created_key}
        - join: dim_dates_lookahead
          type: inner
          alias: dim_dates_lookahead
          sql_on: >-
            ${dim_dates_lookahead.date_key} =
            ${fact_todos.date_due_lookahead_key}
    columns:
      - name: date_start_key
        description: ""
        tests:
          - relationships:
              field: date_key
              to: ref('dim_dates')
        meta:
          dimension:
            hidden: true
            type: string
      - name: date_due_key
        description: ""
        tests:
          - relationships:
              field: date_key
              to: ref('dim_dates')
        meta:
          dimension:
            hidden: true
            type: string
      - name: date_completed_key
        description: ""
        tests:
          - relationships:
              field: date_key
              to: ref('dim_dates')
        meta:
          dimension:
            hidden: true
            type: string
      - name: date_created_key
        description: ""
        tests:
          - relationships:
              field: date_key
              to: ref('dim_dates')
        meta:
          dimension:
            type: string
      - name: todo_key
        description: ""
        meta:
          dimension:
            hidden: true
            type: string
      - name: list_key
        description: ""
        tests:
          - relationships:
              field: list_key
              to: ref('dim_lists')
        meta:
          dimension:
            hidden: true
            type: string
      - name: folder_key
        description: ""
        tests:
          - relationships:
              field: folder_key
              to: ref('dim_folders')
        meta:
          dimension:
            hidden: true
            type: string
      - name: status_key
        description: ""
        tests:
          - relationships:
              field: status_key
              to: ref('dim_statuses')
        meta:
          dimension:
            hidden: true
            type: string
      - name: todo_id
        description: |
          note when joined with lookahead dates:
            - todo_id is null meaning all dummy records inserted from the lookahead dates
            - todo id is not null meaning all records in stg todo.
              - apply is not null condition on most metrics except the actual lookahead metrics.
        meta:
          dimension:
            type: string
          metrics:
            lookahead_count:
              type: count
              description: count of undone tasks ahead. replacement for the habit heatmap
              filters:
                - dim_lists.list_isActive: true
                - dim_statuses.status_desc: undone
                - todo_derived__is_task: true
                - todo_derived__is_active: true
                - todo_derived__tag_semantic: next action
                - completed_date.year_key: "0"
                - lookahead_flag : true
                - dim_dates_lookahead.date_id: "!1900" # todo: how to discard the count in 1900 only.
                # - dim_dates_lookahead.date_id: # todo : watch when LD allows this AND interval filter.
                #     - "inThePast 5 days"
                #     - "inTheNext 3 months"
