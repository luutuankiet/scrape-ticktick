# DERIVED DIMS
      - name: todo_derived__tags
        description: the tags parsed from tasks.
        meta:
          dimension:
            groups: ['derived']
            type: string
            sql: >-
              TRIM(BOTH ' ' FROM REPLACE(REPLACE(REPLACE(${todo_tags}, '[',
              ''), ']', ''), '''', ''))
      - name: todo_derived__tag_semantic
        meta:
          dimension:
            groups: ['derived']
            label: 'tag semantic'
            type: string
            sql: |
              case when ${todo_tags} like '%clarifyme%' then 'inbox' 
              when ${todo_tags} = 'default' or ${todo_tags} like '%@%' then 'next action'
              when ${todo_tags} like '%someday%' then 'someday'
              when ${todo_tags} like '%waiting_for%' then 'waiting for' 
              when ${todo_tags} like '%tickler%' then 'tickler' 
              else TRIM(BOTH ' ' FROM REPLACE(REPLACE(REPLACE(${todo_tags}, '[', ''), ']', ''), '''', ''))      
              end
          metrics:
            tags_count:
              type: count
      - name: todo_derived__is_repeat
        meta: 
          dimension:
            groups: ['derived']
            label: 'is repeat'
            type: boolean
            sql: >-
              case when ${todo_repeatflag} <> 'default' then true else false
              end
      - name : todo_derived__is_task
        description: "derived from custom sql logic"
        meta:
          dimension:
            groups: ['derived']
            label: 'is task'
            type: boolean
            sql: case when NOT (${todo_kind} = 'NOTE' or ${todo_tags} like '%tickler%') then true else false end
        
      - name : todo_derived__is_active
        description: |
          the item belongs to an active folder - not in ('🚀SOMEDAY lists','🛩Horizon of focus','💤on hold lists')
        meta:
          dimension:
            label: 'is active'
            type: boolean
            sql: |
              case when ${dim_folders.folder_name} not in ('🚀SOMEDAY lists','🛩Horizon of focus','💤on hold lists') 
              AND
              ${dim_lists.list_name} not in ('🧳SOMEDAY','📍ref - tickler notes for the day')
              then true else false end